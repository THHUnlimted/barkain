name: Backend Tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'containers/**'
      - 'sourcing/**'
      - '.github/workflows/backend-tests.yml'
      # Editing the no-op companion runs the REAL suite. Paired with that file
      # ignoring itself, this keeps exactly one `test` check reporting on a
      # PR that only touches the companion.
      - '.github/workflows/backend-tests-docs-skip.yml'
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test
          POSTGRES_DB: barkain_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U app -d barkain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run unit tests
        working-directory: backend
        env:
          # NOTE: DEMO_MODE is deliberately NOT set. The `client` fixture
          # stubs auth via app.dependency_overrides; `unauthed_client` relies on
          # the real get_current_user to 401 on missing Authorization header.
          # Setting DEMO_MODE=1 would short-circuit both paths and break
          # auth tests. Real API keys aren't needed — Gemini/Anthropic/Clerk calls
          # are mocked at the service boundary in every unit test.
          # (Renamed from BARKAIN_DEMO_MODE in Step 2i-b.)
          TEST_DATABASE_URL: postgresql+asyncpg://app:test@localhost:5433/barkain_test
          DATABASE_URL: postgresql+asyncpg://app:test@localhost:5433/barkain_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          GEMINI_API_KEY: test-key-not-real
          ANTHROPIC_API_KEY: test-key-not-real
          CLERK_SECRET_KEY: test-key-not-real
          CLERK_PUBLISHABLE_KEY: test-key-not-real
          UPCITEMDB_API_KEY: ""
          FIRECRAWL_API_KEY: ""
        run: |
          python -m pytest --tb=short -q

      # ── M15 sourcing (PR #97) ────────────────────────────────────────
      # `sourcing/` is self-contained and unwired — it has no router, isn't
      # imported by the backend, and its migration 0013 is staged outside
      # infrastructure/migrations/versions/. So it gets its own steps rather
      # than riding the backend pytest run above.
      #
      # Every third-party import under sourcing/ (sqlalchemy, pydantic-settings,
      # httpx, redis) is already covered by backend/requirements.txt, installed
      # above. openpyxl is an optional soft-dep with a graceful error path, so
      # XLSX ingest stays uncovered here by design — CSV/TSV is the tested path.
      - name: Sourcing (M15) offline smoke
        working-directory: sourcing
        run: |
          # demo_crunch.py runs the whole decision path — ingest → UPC
          # normalize → landed cost → fees → demand → scoring → inquiry — with
          # no network and no database. Until the test suite lands this is the
          # only regression signal on 9.8K lines, so it is NOT optional.
          python demo_crunch.py

      - name: Sourcing (M15) unit tests
        working-directory: sourcing
        env:
          # Both entries are explicit: `sourcing/` resolves `from m15_sourcing.X`,
          # `backend/` resolves `from app.database import Base` in models.py —
          # the module's one cross-boundary import. cwd alone would cover the
          # first under `working-directory: sourcing`, but pytest's import modes
          # make implicit-cwd-on-path fragile, so neither is left to chance.
          PYTHONPATH: ${{ github.workspace }}/sourcing:${{ github.workspace }}/backend
          TEST_DATABASE_URL: postgresql+asyncpg://app:test@localhost:5433/barkain_test
          DATABASE_URL: postgresql+asyncpg://app:test@localhost:5433/barkain_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          GEMINI_API_KEY: test-key-not-real
          ANTHROPIC_API_KEY: test-key-not-real
          CLERK_SECRET_KEY: test-key-not-real
          CLERK_PUBLISHABLE_KEY: test-key-not-real
          UPCITEMDB_API_KEY: ""
          FIRECRAWL_API_KEY: ""
        run: |
          if [ -d tests ]; then
            python -m pytest --tb=short -q
          else
            echo "::warning title=M15 sourcing has no tests::sourcing/tests/ does not exist. \
          9,851 lines (upc, fees, ingest, scoring, demand, landed_cost, plans, forecast) \
          are pure functions with zero unit coverage — only the offline smoke above guards them."
          fi

      - name: Lint
        run: |
          pip install ruff
          ruff check backend/ scripts/ sourcing/
